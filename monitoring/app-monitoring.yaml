apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devsecops-app
  namespace: devsecops
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: devsecops-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devsecops-app-alerts
  namespace: devsecops
  labels:
    release: monitoring
spec:
  groups:
    - name: devsecops-app
      rules:
        - alert: AppDown
          expr: up{job="devsecops-app"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "devsecops-app target is down"
        - alert: HighErrorRate
          expr: |
            sum(rate(app_requests_total{status=~"5.."}[5m]))
              / sum(rate(app_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than 5% of requests are failing"
        - alert: HighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum(rate(app_request_latency_seconds_bucket[5m])) by (le)) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "p95 latency above 500ms"
