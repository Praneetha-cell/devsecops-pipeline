apiVersion: v1
kind: ConfigMap
metadata:
  name: devsecops-app-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  devsecops-app.json: |
    {
      "title": "DevSecOps App",
      "uid": "devsecops-app",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Requests / sec",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum(rate(app_requests_total[1m])) by (endpoint)", "legendFormat": "{{endpoint}}" } ]
        },
        {
          "id": 2, "type": "timeseries", "title": "p95 latency (s)",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "histogram_quantile(0.95, sum(rate(app_request_latency_seconds_bucket[5m])) by (le))", "legendFormat": "p95" } ]
        },
        {
          "id": 3, "type": "stat", "title": "5xx error ratio",
          "gridPos": { "x": 0, "y": 8, "w": 8, "h": 6 },
          "targets": [ { "expr": "sum(rate(app_requests_total{status=~\"5..\"}[5m])) / sum(rate(app_requests_total[5m]))" } ]
        },
        {
          "id": 4, "type": "stat", "title": "Pods up",
          "gridPos": { "x": 8, "y": 8, "w": 8, "h": 6 },
          "targets": [ { "expr": "sum(up{job=\"devsecops-app\"})" } ]
        }
      ]
    }
